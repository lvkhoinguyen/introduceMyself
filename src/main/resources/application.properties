spring.application.name=introduce

# Profile mặc định là 'dev' (sử dụng H2 in-memory database).
# Để chuyển sang MySQL: đổi giá trị thành 'mysql' hoặc set biến môi trường SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.show-sql=true
spring.jpa.open-in-view=false